name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bulkman_test_resilient_circuit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check bulkman tests

      - name: Format (black)
        run: black --check bulkman tests

      - name: Type check (mypy)
        run: mypy bulkman

      - name: Test (pytest + coverage)
        run: pytest

      - name: Build wheel
        run: |
          pip wheel . --no-deps -w dist
          python -c "import glob, zipfile; w = glob.glob('dist/*.whl')[0]; assert any(n.endswith('py.typed') for n in zipfile.ZipFile(w).namelist()), 'py.typed missing from wheel'"
