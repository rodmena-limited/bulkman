[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkman"
version = "2.0.1"
description = "Bulkhead pattern implementation with AnyIO (asyncio) and resilient circuit breaking"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Farshid Ashouri", email = "farsheed.ashouri@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
    "Framework :: AsyncIO",
]
requires-python = ">=3.9"
dependencies = [
    "anyio>=4.0.0",
    "sniffio>=1.1.0",
    # bulkman uses resilient_circuit's policy internals (_status); pin the
    # major version so private API changes cannot silently break at install.
    "resilient-circuit[postgres]>=0.4.6,<0.5",
]

[project.optional-dependencies]
# pytest-anyio runs the async tests on the asyncio backend.
dev = [
    "anyio>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "testcontainers[postgres]>=4.0.0",
    "psycopg[binary]>=3.0.0",
    "basedpyright>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/rodmena-limited/bulkman"
Repository = "https://github.com/rodmena-limited/bulkman"

[tool.setuptools.packages.find]
include = ["bulkman*"]

[tool.setuptools.package-data]
bulkman = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B904",  # Within an except clause, raise exceptions with from e or from None
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "--cov=bulkman",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Run every async test through anyio (asyncio backend, see conftest fixture)
anyio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Installed third-party packages (anyio, pytest) use 3.10+ syntax that mypy
# rejects under the 3.9 target; bulkman itself is checked with them as Any.
follow_imports = "skip"

[tool.basedpyright]
pythonVersion = "3.12"
exclude = ["bulkhead.py", ".venv"]
reportExplicitAny = false
reportAny = false
reportPrivateUsage = false
reportUnusedParameter = false

[tool.coverage.run]
source = ["bulkman"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
